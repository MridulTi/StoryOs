[project]
name = "storyos"
version = "0.1.0"
description = "A personal storytelling operating system — discover stories in everyday life."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "StoryOS Contributors" }]
keywords = ["storytelling", "journal", "memory", "creativity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Sociology",
]

dependencies = [
    "platformdirs>=4.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
storyos = "storyos.cli.app:main"

[project.urls]
Documentation = "https://github.com/storyos/storyos#readme"
Source = "https://github.com/storyos/storyos"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storyos"]

[tool.hatch.build.targets.wheel.force-include]
"src/storyos/prompts" = "storyos/prompts"

[tool.hatch.build.targets.sdist]
only-include = ["src/storyos", "pyproject.toml", "README.md", "storyos.example.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
